<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Implémentation interactive de l'algorithme du simplexe en JavaScript avec une interface responsive stylisée avec Tailwind CSS. Résolvez vos problèmes d’optimisation linéaire facilement." />
  <meta name="keywords" content="simplexe, algorithme, JavaScript, optimisation linéaire, tailwind, mathématiques, maximisation" />
  <meta name="author" content="Mavinga Lukumbi Hermès et Kalenda Dieudonne" />
  <title>Résolveur Simplexe</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col items-center p-4">

  <header class="mb-6 text-center">
    <h1 class="text-3xl font-bold text-blue-700 mb-2">Résolveur Simplexe</h1>
    <p class="text-gray-600">Optimisez vos fonctions linéaires avec une interface simple et responsive</p>
  </header>

  <main class="w-full max-w-4xl bg-white shadow-md rounded-xl p-6 space-y-4">
    <!-- Formulaire de saisie -->
    <form id="simplexForm" class="space-y-4">
      <div>
        <label for="variables" class="block font-medium">Nombre de variables :</label>
        <input type="number" id="variables" name="variables" min="1" class="mt-1 w-full border border-gray-300 rounded px-3 py-2" required>
      </div>

      <div>
        <label for="contraintes" class="block font-medium">Nombre de contraintes :</label>
        <input type="number" id="contraintes" name="contraintes" min="1" class="mt-1 w-full border border-gray-300 rounded px-3 py-2" required>
      </div>

      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Valider</button>
    </form>

    <!-- Zone de saisie dynamique -->
    <div id="formZone" class="space-y-4"></div>

    <!-- Bouton de résolution -->
    <div id="solveBtnContainer" class="hidden">
      <button onclick="solveSimplex()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Résoudre</button>
    </div>

    <!-- Résultat -->
    <div id="result" class="mt-6 text-lg font-semibold text-green-700"></div>
  </main>

  <footer class="mt-10 text-sm text-gray-500 text-center">
    &copy; 2025 Mavinga Lukumbi Hermès et Kalenda Dieudonne - Projet Simplexe en JavaScript
  </footer>

  <script>
    const form = document.getElementById("simplexForm");
    const formZone = document.getElementById("formZone");
    const solveBtnContainer = document.getElementById("solveBtnContainer");
    const result = document.getElementById("result");

    let n, m;

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      n = parseInt(document.getElementById("variables").value);
      m = parseInt(document.getElementById("contraintes").value);
      renderFormInputs(n, m);
    });

    function renderFormInputs(n, m) {
      formZone.innerHTML = "";

      const objectiveLabel = document.createElement("p");
      objectiveLabel.textContent = "Fonction Objectif : (Z =)";
      formZone.appendChild(objectiveLabel);

      const objectiveRow = document.createElement("div");
      for (let i = 0; i < n; i++) {
        const input = document.createElement("input");
        input.type = "number";
        input.placeholder = `x${i + 1}`;
        input.className = "border w-20 mx-1 px-2 py-1 rounded";
        input.name = `obj${i}`;
        objectiveRow.appendChild(input);
      }
      formZone.appendChild(objectiveRow);

      for (let j = 0; j < m; j++) {
        const constraintLabel = document.createElement("p");
        constraintLabel.textContent = `Contrainte ${j + 1} :`;
        formZone.appendChild(constraintLabel);

        const constraintRow = document.createElement("div");
        for (let i = 0; i < n; i++) {
          const input = document.createElement("input");
          input.type = "number";
          input.placeholder = `x${i + 1}`;
          input.className = "border w-20 mx-1 px-2 py-1 rounded";
          input.name = `con${j}_${i}`;
          constraintRow.appendChild(input);
        }

        const rhs = document.createElement("input");
        rhs.type = "number";
        rhs.placeholder = "≤ b";
        rhs.className = "border w-24 mx-1 px-2 py-1 rounded";
        rhs.name = `rhs${j}`;
        constraintRow.appendChild(rhs);

        formZone.appendChild(constraintRow);
      }

      solveBtnContainer.classList.remove("hidden");
    }

    function solveSimplex() {
      const A = [];
      const B = [];
      const C = [];

      for (let j = 0; j < m; j++) {
        A[j] = [];
        for (let i = 0; i < n; i++) {
          A[j][i] = parseFloat(document.getElementsByName(`con${j}_${i}`)[0].value) || 0;
        }
        B[j] = parseFloat(document.getElementsByName(`rhs${j}`)[0].value) || 0;
      }

      for (let i = 0; i < n; i++) {
        C[i] = parseFloat(document.getElementsByName(`obj${i}`)[0].value) || 0;
      }

      const solution = simplex(A, B, C);
      result.innerHTML = `
        <p>x = [${solution.x.map(v => v.toFixed(2)).join(", ")}]</p>
        <p>Z = ${solution.z.toFixed(2)}</p>
      `;
    }

    function simplex(A, B, C) {
      const m = A.length;
      const n = A[0].length;
      const tableau = [];

      for (let i = 0; i < m; i++) {
        tableau[i] = [...A[i], ...Array(m).fill(0), B[i]];
        tableau[i][n + i] = 1;
      }

      const objectiveRow = [...C.map(c => -c), ...Array(m + 1).fill(0)];
      tableau.push(objectiveRow);

      while (true) {
        const lastRow = tableau[tableau.length - 1];
        const entering = lastRow.findIndex(v => v < 0);
        if (entering === -1) break;

        let minRatio = Infinity;
        let pivotRow = -1;
        for (let i = 0; i < m; i++) {
          if (tableau[i][entering] > 0) {
            const ratio = tableau[i][n + m] / tableau[i][entering];
            if (ratio < minRatio) {
              minRatio = ratio;
              pivotRow = i;
            }
          }
        }

        if (pivotRow === -1) break;

        const pivot = tableau[pivotRow][entering];
        for (let j = 0; j < tableau[pivotRow].length; j++) {
          tableau[pivotRow][j] /= pivot;
        }

        for (let i = 0; i < tableau.length; i++) {
          if (i !== pivotRow) {
            const factor = tableau[i][entering];
            for (let j = 0; j < tableau[i].length; j++) {
              tableau[i][j] -= factor * tableau[pivotRow][j];
            }
          }
        }
      }

      const solution = Array(n).fill(0);
      for (let i = 0; i < m; i++) {
        let pivotCol = tableau[i].slice(0, n).findIndex((v, col) => v === 1 && tableau.every((row, ri) => ri === i || row[col] === 0));
        if (pivotCol !== -1) {
          solution[pivotCol] = tableau[i][n + m];
        }
      }

      const z = tableau[tableau.length - 1][n + m];
      return { x: solution, z: z };
    }
  </script>

</body>
</html>
